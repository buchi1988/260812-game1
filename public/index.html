<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0e1a" />
    <meta name="description" content="みんなで光るオーブを集めて競う、リアルタイム マルチプレイ ゲーム" />
    <title>Dot Rush — みんなでオーブ集め</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%234dd0ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud__left">
          <span class="logo">DOT<span>RUSH</span></span>
          <button id="roomChip" class="chip" type="button" title="招待リンクをコピー">
            <span class="chip__label">ルーム</span>
            <span id="roomName" class="chip__value">—</span>
          </button>
        </div>

        <div class="hud__center">
          <div id="timer" class="timer">90</div>
          <div class="timer__bar"><div id="timerFill" class="timer__fill"></div></div>
        </div>

        <div class="hud__right">
          <button id="soundBtn" class="icon-btn" type="button" title="効果音のオン/オフ" aria-label="効果音">🔊</button>
          <span class="stat"><b id="playerCount">0</b> 人</span>
          <span class="stat stat--ping"><b id="ping">–</b> ms</span>
        </div>
      </header>

      <div class="play">
        <main class="stage" id="stage">
          <canvas id="canvas"></canvas>
          <!-- スマホ用の操作ヒント -->
          <div class="touch-hint hidden" id="touchHint">画面をドラッグして移動</div>
        </main>

        <!-- 順位表。広い画面では盤面の横、狭い画面では盤面に重ねて表示する -->
        <section class="board" id="board" aria-label="順位表">
          <h2 class="board__title">順位</h2>
          <ol id="boardList" class="board__list"></ol>
          <p class="board__best" id="boardBest"></p>
        </section>

        <!-- 結果発表 -->
        <div class="overlay overlay--result hidden" id="resultOverlay">
          <div class="panel">
            <h2 class="panel__title">ラウンド終了！</h2>
            <ol id="resultList" class="result-list"></ol>
            <p class="panel__note">次のラウンドまで <b id="resultCountdown">8</b> 秒</p>
          </div>
        </div>

        <!-- 参加画面 -->
        <div class="overlay overlay--join" id="joinOverlay">
          <div class="panel">
            <h1 class="panel__title panel__title--big">DOT RUSH</h1>
            <p class="panel__lead">
              光るオーブを集めて競争しよう。<br />
              同じルーム名の人とその場で対戦できます。
            </p>

            <form id="joinForm" class="join-form" autocomplete="off">
              <label class="field">
                <span class="field__label">なまえ</span>
                <input id="nameInput" class="field__input" type="text" maxlength="12" placeholder="ゲスト" />
              </label>
              <label class="field">
                <span class="field__label">ルーム名</span>
                <input
                  id="roomInput"
                  class="field__input field__input--room"
                  type="text"
                  maxlength="12"
                  placeholder="LOBBY"
                  pattern="[A-Za-z0-9]{1,12}"
                  title="英数字 1〜12 文字"
                />
              </label>
              <button class="btn" type="submit">ゲームに参加</button>
            </form>

            <ul class="howto">
              <li><b>移動</b> WASD / 矢印キー、スマホは画面をドラッグ</li>
              <li><b>得点</b> 水色のオーブ +1、金のオーブ +3</li>
              <li><b>ルール</b> 90 秒で得点を競う。終わったら自動で次ラウンド</li>
            </ul>
          </div>
        </div>

        <!-- 接続が切れたとき -->
        <div class="overlay overlay--error hidden" id="errorOverlay">
          <div class="panel">
            <h2 class="panel__title">接続が切れました</h2>
            <p class="panel__lead" id="errorText">サーバーとの接続が失われました。</p>
            <button class="btn" id="retryBtn" type="button">再接続</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/game.js" defer></script>
  </body>
</html>
